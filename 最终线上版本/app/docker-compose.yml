services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tongzhuo
      MYSQL_USER: tongzhuo
      MYSQL_PASSWORD: tongzhuo
      MYSQL_ROOT_PASSWORD: tongzhuo
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - tongzhuo-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utongzhuo", "-ptongzhuo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tongzhuo-mysql:
